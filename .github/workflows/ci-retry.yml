name: CI retry

# After each finished CI run. A run that failed only because integration tests
# collided in the shared database (a deadlock, a lock timeout, a moved fee
# snapshot) has its failed jobs re-run once, and the collision goes into an
# issue. A failed nightly run opens an issue. Every other failure is left red.
# The rules and their tests: scripts/ci-retry.mjs.
#
# workflow_run always runs this file as it is on main, and checks out main:
# no code from the pull request runs here.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: ci-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    name: Re-run a database collision once
    # Runs from forks are left alone.
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Decide, report and re-run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/ci-retry.mjs
