name: CI

# Every PR and main push gets a completed gate. Only allowlisted Markdown
# changes skip runtime checks. Full checks use local Supabase, without hosted
# Supabase or Vercel credentials.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  scope:
    name: Scope and document checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full_suite: ${{ steps.scope.outputs.full_suite }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Classify the complete Git diff
        id: scope
        run: node scripts/ci-scope.mjs
      - name: Test repository helpers
        run: node --test "scripts/*.test.mjs"
      - name: Check tracked documents
        run: node scripts/check-docs.mjs

  static:
    name: Lint, typecheck and unit tests
    needs: scope
    if: ${{ needs.scope.outputs.full_suite == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  database-and-browser:
    name: Integration, build and browser tests
    needs: scope
    if: ${{ needs.scope.outputs.full_suite == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The Supabase CLI is the repo's own pinned dev dependency, the same
      # version every worktree runs.
      - name: Start local Supabase
        run: npm run db:start
      - name: Write .env.local from the local stack
        run: npm run env:local
      - run: npm run test:integration
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  complete:
    name: CI complete
    if: ${{ always() }}
    needs: [scope, static, database-and-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Require every applicable check
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-scope.mjs --gate
