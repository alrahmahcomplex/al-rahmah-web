name: CI

# Every PR and main push gets a completed gate. Only allowlisted Markdown
# changes skip runtime checks. Full checks use local Supabase, without hosted
# Supabase or Vercel credentials.

on:
  pull_request:
  push:
    branches: [main]

# A new commit on a pull request cancels that pull request's older run. A push
# to main gets a group of its own, so the next merge never cancels or replaces
# its run: every merge gets a finished run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  scope:
    name: Scope and document checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full_suite: ${{ steps.scope.outputs.full_suite }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Classify the complete Git diff
        id: scope
        run: node scripts/ci-scope.mjs
      - name: Test repository helpers
        run: node --test "scripts/*.test.mjs"
      - name: Check tracked documents
        run: node scripts/check-docs.mjs

  static:
    name: Lint, typecheck and unit tests
    needs: scope
    if: ${{ needs.scope.outputs.full_suite == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  # The integration tests and the browser tests each start their own local
  # Supabase, so neither waits for the other.
  integration:
    name: Integration tests
    needs: scope
    if: ${{ needs.scope.outputs.full_suite == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Local Supabase binds host ports 55420 to 55429 (supabase/config.toml).
      # Linux hands out ports from 32768 to 60999 to outgoing connections, so
      # an image pull could take one first and the start failed with "address
      # already in use". Reserved ports are never handed out.
      - name: Reserve the local Supabase ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=55420-55429
      # The Supabase CLI is the repo's own pinned dev dependency, the same
      # version every worktree runs.
      - name: Start local Supabase
        run: npm run db:start
      - name: Write .env.local from the local stack
        run: npm run env:local
      - run: npm run test:integration

  browser:
    name: Build and browser tests
    needs: scope
    if: ${{ needs.scope.outputs.full_suite == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reserve the local Supabase ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=55420-55429
      - name: Start local Supabase
        run: npm run db:start
      - name: Write .env.local from the local stack
        run: npm run env:local
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  complete:
    name: CI complete
    if: ${{ always() }}
    needs: [scope, static, integration, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Require every applicable check
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-scope.mjs --gate
